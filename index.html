<body><main class="document"><h1 class="page-title">海关账册账实一致性项目</h1><div class="loading" id="loading">正在加载文档…</div><article id="content"></article></main>
<script>
const markdown = "\n\u003e [!项目背景]\n\u003e  \n\u003e \n\u003e 公司在阿联酋迪拜保税区设立保税仓，货物进出保税区均需向阿联酋海关申报，因此需建立完整的海关账册库存，并与仓库实际库存进行核对，降低因账实差异过大产生的海关合规风险。\n\u003e \n\u003e 目前迪拜 WMS 主要记录“上架可售库存”，无法完整覆盖货物进区后上架前等实物状态；同时，合包业务中国内发运至迪拜的国内子包裹不记入迪拜 WMS 库存，系统库存无法完整反映保税区内实际货物。\n\u003e \n\u003e 保税仓运营五年以来尚未进行海关层面的库存核算，与第三方清关服务商提供的海关库存数据对比后，发现货物数量差异达千万级、货值差异达亿元级，面临罚款风险。\n\u003e \n\u003e 因此，本项目旨在建立覆盖的全链路库存核算模型，实现海关账册、系统库存与实物库存的可追溯对账。\n\n### 1.1 项目目标（Goals）\n\n1. **建立\"在仓实物\"全链路账册**：以 WMS 库存为底座，把入区后到出区前的全部实物状态纳入统计（含 WMS 未覆盖的\"已清关未收货\"状态与\"合包国内子包裹\"），形成与海关账册口径一致的\"海关实物库存台账\"。\n\n2. **账实对账常态化**：建立与第三方清关服务商所持海关账册的周期性对账机制，把账实差异从\"千万级数量 / 亿元货值级\"压降至可接受阈值之内（初拟数量差异率 \u003c 2%，阈值在上线前与关务共同核定）。\n\n3. **差异可追溯、可闭环**：任一差异可定位到单据、状态节点与根因类别（报关资料不一致 / 运输运营异常 / 系统漏记 / 其他），并形成\"发现 → 核查 → 处理 → 关账\"的小闭环。\n\n4. **支撑外部监管与协议治理**：降低海关合规风险，为关务合规提供海关账册平衡表（应对走私/偷漏税嫌疑的举证材料），并为监管第三方清关服务商、优化服务协议提供量化 KPI 依据。\n\n### 1.2 范围（In Scope）\n\n\n1.全状态库存台账：覆盖\"已清关未收货 → 收货 → 质检 → 待上架 → 库内上架库存 → 下架/打包 （待出库）→ 已打包待发货 → 已出区\"全部统计状态，含合包国内子包裹\n\n2.差异管理体系：差异工单、根因分类、处理闭环、状态跟踪，包括关务资料一致性核查，TMS 发送关务资料 vs 服务商实际申报的比对（识别\"发了两次/以旧为准/申报错误\"） ，调拨应收数 vs 实收数差异管理（运输运营异常）\n\n3.报表与门户：海关账册平衡表、库存快照、对账月报、KPI 考核报表 \n\n## 2.干系人\n干系人清单\n\n| 干系人       | 角色      | 职责                  |\n| --------- | ------- | ------------------- |\n| 亚太区负责人    | 项目发起人   | 管控整体业务风险            |\n| WMS、TMS产品 | 系统建设    | 系统需求交付              |\n| 关务部       | 业务主要使用方 | 海关政策、合规风险把控         |\n| 采购        | 协作方     | 物资采购入库管理            |\n| 仓储运营      | WMS使用方  | 收货/质检/打包/发货各状态数据准确性 |\n| 物流运营      | TMS使用方  | 关务资料发送核查，入区/出区运输跟踪  |\n| 清关服务商（外部） | 协作方     | 提供海关账册数据、申报一致性      |\n\n## 3.业务流程图\n### 3.1业务总流程\n\n\n```mermaid\n\nflowchart TB\nsubgraph SW[\"① 入区（进保税仓）\"]\nDIRECTION1[\"入库类型：\u003cbr/\u003e调拨入库 / 客退拒收 / 品牌采购 / 采购物资\"]\nHECANG[\"合包国内子包裹入区\"]\nend\n\nsubgraph CLR[\"② 清关环节\"]\nTMSAPI[\"TMS 发送关务资料\u003cbr/\u003e（SKU/HS编码/品名/SKU数量/SKU重量/SKU申报价格）\"]\nBROKER[\"第三方清关服务商申报\"]\nCUSTOMS[\"迪拜海关放行（清关完成）\"]\nend\n\nsubgraph ZONE[\"③ 保税区仓库内（WMS 作业 + 状态记账）\"]\nASTAGE[\"收货暂存区（未收货）\"]\nRECEIVE[\"PDA 收货扫描\u003cbr/\u003e→ WMS初始入库状态：已收货\"]  \nQC{\"质检\"} \nSHELF[\"待上架\"]\nINV[\"货区容器库存（已入库/已预占/待出库）\"]\nBSTAGE2[\"整箱暂存\u003cbr/\u003e（非正品：在库单独统计，不并入货区容器库存）\"]\nOUT2[\"已出库\u003cbr/\u003e④ 出区\u003cbr/\u003e人工处理出库：整箱暂存 → 已出库(大客户销售出库）\"]\nHESTAGE[\"合包子包裹暂存架位\u003cbr/\u003e（收货暂存，等待合包业务本地商品拣货下架）\"]\nDUBPICK[\"迪拜本地商品拣货下架\"]\nPACK[\"打包：本地非合包+合包（本地商品+国内子包裹）\u003cbr/\u003e迪拜WMS商品库存→已出库\"]\nBSTAGE[\"出库暂存区\u003cbr/\u003e已打包未发货\"]\nCANCEL[\"取消返仓-待处理\u003cbr/\u003e1.合包子包裹打包前取消，本地商品状态仍未“待出库”\u003cbr/\u003e2.非合包\u0026合包包裹打包后发货前被取消\u003cbr/\u003e（互斥桶：从「已打包待发货/已收货未打包」原子迁出，不重叠计数）\"]\nSCANOUT[\"发货扫描\u003cbr/\u003e→ 已发货\u003cbr/\u003e④ 出区：包裹销售出库（物资出库分摊在包裹上）\"]\nend  \n\nsubgraph REC[\"⑤ 海关账册与对账\"]\nCUSLEDGER[\"海关账册（服务商提供）\"]\nPHYSICAL[\"实物台账（本系统）\"]\nENGINE[\"对账引擎\u003cbr/\u003e数量 / 货值差异计算\"]\nDIFF[\"差异管理：\u003cbr/\u003e差异工单 → 根因分类 → 处理 → 关账\"]\nREPORT[\"报表：海关账册平衡表 / 对账月报 / 服务商 KPI\"]\nend  \n\n%% ①→② 关务资料：4 类入库 与 合包国内子包裹 一致 \n\nDIRECTION1 --\u003e TMSAPI\nHECANG --\u003e TMSAPI\nTMSAPI --\u003e BROKER\nBROKER --\u003e CUSTOMS\n%% 通用收货（清关后进仓收货）\nCUSTOMS --\u003e ASTAGE\nASTAGE --\u003e RECEIVE\n\n%% 4 类入库主链路（国内子包裹不需质检）：质检为判断节点\nRECEIVE --\u003e QC\nQC -- \"正品\" --\u003e SHELF\nSHELF --\u003e INV\n\n%% 非正品 → 整箱暂存（\"在库待处理\"状态：仍在库、单独统计，不并入货区库存）\nQC -- \"非正品\" --\u003e BSTAGE2\n%% 状态流转：整箱暂存 → 已出库，由业务人工处理出库（大客户销售），无线上发货扫描事件\nBSTAGE2 -- 人工处理出库（大客户销售） --\u003e OUT2\n%% 出区扣账（双账并行）：海关账册侧由服务商线下申报出区后扣账（不经 TMS/线上申报链路）；实物台账侧由本系统人工扣账（在库待处理→已出库）\nOUT2 -.扣账.-\u003e CUSLEDGER \nOUT2 -.人工扣账.-\u003e PHYSICAL\n%% 合包国内子包裹：收货后暂存架上，等本地商品拣货下架后合包，不走质检\nRECEIVE --\u003e HESTAGE\nINV --\u003e DUBPICK\nDUBPICK --\u003e PACK\nHESTAGE --\u003e PACK\nPACK--\u003e BSTAGE\nBSTAGE --\u003e SCANOUT\n%% 取消返仓（互斥迁移）：包裹被取消，账务从待出库队列迁出，进入在库“取消返仓-待处理”，不再计入“已打包待发货”、“出库合包国内子包裹-已收货未打包”；且未出区，对账不产生双账差异\nBSTAGE -.包裹取消.-\u003e CANCEL\nHESTAGE -.合包包裹取消.-\u003e CANCEL\nCANCEL -- 返仓处理完成（重新入库） --\u003e INV\nCUSLEDGER --\u003e ENGINE\nCUSTOMS -.海关口径已入账.-\u003e CUSLEDGER\nRECEIVE -.入系统账.-\u003e PHYSICAL\nSCANOUT -.扣账.-\u003e PHYSICAL\nPHYSICAL --\u003e ENGINE\nENGINE --\u003e DIFF\nDIFF --\u003e REPORT\n%%出区\nSCANOUT -.扣账.-\u003eCUSLEDGER\n\n```\n物理库存 = 多个互斥库存状态桶的数量之和\n\n**基于此，可归类为以下实物在库统计状态：**\n**1.调拨入库-已收货未质检**\n**2.调拨入库-已质检待上架**\n**3.客退入库-已收货未质检**\n**4.客退入库-已质检待上架**\n**5.货区容器库存**\n**6.出库合包国内子包裹-已收货未打包**\n**7.出库包裹（合包\u0026非合包）-已打包待发货**\n**8.整箱暂存**\n**9.包裹取消返仓-待处理（这里需要增加差异机制：例如由库存引起的包裹取消，需捋清楚如果是合包国内子包裹商品缺失导致的取消，还是因为迪拜本地仓库商品缺失）**\n**（调拨入库-已清关未收货）**\n**（客退入库-已清关未收货）**\n**（合包国内子包裹入库-已清关未收货）**\n\n\u003e [!NOTE]\n\u003e PS：因目前TMS轨迹无“清关完成”节点，造成系统的货物统计盲区，由仓库人员与清关服务商人工盘点“已清关未收货”状态的在途货物\n#### 流程要点说明：\n1. **双账并行**：海关账册（清关服务商口径）在\"清关完成\"即入账；实物台账（本系统）在\"收货扫描\"起入账。二者口径差异的典型窗口就是\"已清关未收货\"**——这是当前系统没有统计、却算在海关账册里的\"盲区库存\"，也是差异主来源之一。\n\n2. **合包国内子包裹**：国内发运至迪拜的国内子包裹，入区后在收货暂存区/合包作业区，**从不进入 WMS 的库存**，只在出库时并入\"合包包裹\"。WMS无此账，需在本系统中单独登记（入区 → 已收货未打包 → 已打包 → 已出区）。\n\n3. **出区节点**：以出库暂存区\"发货扫描\"作为\"已出区\"判定点（托/票级扫描），同时触发实物台账关账与海关出区核销口径的衔接。\n\n4. **非正品货（整箱暂存 → 人工出库）**：质检判定非正品的货物进行整箱暂存，后续出货为人工处理出库（联系大客户销售出库）；该出区清关申报由线下进行（不走 TMS 线上关务资料与系统申报链路，也无线上发货扫描事件），两侧扣账：海关账册由服务商申报出区后扣账、本系统**人工扣账**转\"已出库\"。本链路的核心差异为：服务商申报出区数量 vs 本系统实际人工出库数量。\n\n5. **包裹取消返仓（互斥计数）**：拣货下架后发货前的包裹被取消时，为避免与既有出库统计状态（出库合包国内子包裹-已收货未打包、出库包裹-已打包待发货）重复计数，台账执行**互斥状态桶**规则：**任一包裹在任一时刻恰好落在一个统计状态桶**。取消 = **原子迁移**——包裹从「出库包裹-已打包待发货」或「出库合包国内子包裹-已收货未打包」桶中迁出，迁入 「待处理-取消返仓」桶。返仓处理完成后重新入库（可售库存）。双账口径：取消返仓包裹从未出区，海关账册与实物台账两账同记\"在库\"，正常不产生差异；仅在海关账册已申报出区而包裹实际取消留库时产生差异（场景 C）。\n### 3.2调拨入库：\n由中东其他地区退货仓将货物调拨回迪拜保税仓，在迪拜保税仓的主要为A类质检，检查货物数量，多货/少货。\n关务申报的应收数量与实收不符：（1）关务申报资料数量变更但服务商按照旧版本进行申报 （2）服务商段货物丢失，追责服务商\n\n```mermaid\n  flowchart LR\n\n      subgraph SNAP[\"同一时刻多张调拨单并存（快照）\"]\n\n          B1[\"调拨单A：已收货\u003cbr/\u003e计入 → 应收数量\"]\n\n          B2[\"调拨单B：已质检\u003cbr/\u003e计入 → 实收数量\"]\n\n          B3[\"调拨单C：已收货\u003cbr/\u003e计入 → 应收数量\"]\n\n          B4[\"调拨单D：待收货\u003cbr/\u003e（暂不计入台账）\"]\n\n      end\n\n  \n\n      subgraph BOOK[\"台账口径（调拨入库合计）\"]\n\n          READY[\"统计状态：调拨入库-已收货未质检\u003cbr/\u003eΣ「已收货」单 × 应收数量\"]\n\n          DONE[\"统计状态：调拨入库-已质检待上架\u003cbr/\u003eΣ「已质检」单 × 实收数量\"]\n\n          TOTAL[\"台账合计\u003cbr/\u003e= 已收货未质检 + 已质检待上架\"]\n\n      end\n\n  \n\n      B1 --\u003e READY\n\n      B3 --\u003e READY\n      \n      B2 --\u003e DONE\n\n      READY --\u003e TOTAL\n\n      DONE --\u003e TOTAL\n\n  \n\n      subgraph DIFF[\"差异机制\"]\n\n          D1[\"差异标识点：已收货 → 已质检（质检开箱核对环节）\"]\n\n          D2[\"数量差异 = 应收数量 − 真实实收数量\"]\n\n          D3[\"差≠0 → 生成差异记录 → 差异工单\"]\n\n          D1 -.-\u003e D3\n\n          D2 -.-\u003e D3\n\n      end\n```\n\n**记账口径说明**（台账快照聚合公式）：\n- 「已收货」单：**默认按应收数量**计价入台账（实物已暂存、未开箱检验，账面为理论值）。\n- 「已质检」单：**按真实实收数量**计价入台账（开箱逐件扫描后实测值，对应 WMS「待上架」）。\n- 「待收货」单：发运在途，**暂不计入**台账。\n- 差异机制在「已收货 → 已质检」质检环节标记差异：`数量差异 = 应收 − 实收`，不配平则进入对账差异工单。\n\n### 3.3客退/拒收入库\n客退/拒收的包裹（退货单号即包裹号），由物流服务商申报后送回迪拜保税仓，由仓库质检人员对退货包裹进行B类质检，如果是正品则待上架，如果是黑码（即非本公司销售的商品）则暂存或销毁。\n差异类型：申报的商品数量与实际收货不符，如数量不符、商品不符（黑码）\n```mermaid\n\nflowchart LR\nsubgraph SNAP[\"同一时刻多张退货单并存（快照）\"]\nB1[\"退货单A：已收货\u003cbr/\u003e计入 → 申报数量\"]\nB2[\"退货单B：已质检·正品\u003cbr/\u003e计入 → 实收数量\"]\nB3[\"退货单C：已质检·非正品\u003cbr/\u003e计入 → 实收数量（整箱暂存桶）\"]\nB4[\"退货单D：申报在途\u003cbr/\u003e（暂不计入台账）\"]\nend\n\nsubgraph BOOK[\"台账口径（客退/拒收合计）\"]\nREADY[\"统计状态：客退入库-已收货未质检\u003cbr/\u003eΣ「已收货」单 × 申报数量\"]\nGENUINE[\"统计状态：客退入库-已质检正品待上架\u003cbr/\u003eΣ「已质检·正品」单 × 实收数量\"]\nFAKE[\"统计状态：客退入库-已质检非正品整箱暂存\u003cbr/\u003eΣ「已质检·非正品」单 × 实收数量\"]\nTOTAL[\"台账合计\u003cbr/\u003e= 已收货未质检 + 已质检正品\u003cbr/\u003e+ 已质检非正品（单独列示）\"]\nend\n\nB1 --\u003e READY\nB2 --\u003e GENUINE\nB3 --\u003e FAKE\nREADY --\u003e TOTAL\nGENUINE --\u003e TOTAL\nFAKE --\u003e TOTAL\n\nsubgraph DIFF[\"差异机制\"]\nD1[\"差异标识点：已收货 → 已质检（质检开箱逐件核对环节）\"]\nD2[\"数量差异 = 申报数量 − 实收数量（申报与实际收货不符）\"]\nD2B[\"商品不符（黑码）\u003cbr/\u003e实收检出黑码 → 按黑码条数剥离，\u003cbr/\u003e检出非正品计入整箱暂存\"]\nD3[\"差 ≠ 0 或检出黑码 → 生成差异记录 → 差异工单\u003cbr/\u003e（根因归「申报不一致」/「退货商品黑码异常」）\"]\nD1 -.-\u003e D3\nD2 -.-\u003e D3\nD2B -.-\u003e D3\nend\n```\n**记账口径说明**（客退/拒收台账快照聚合公式，与调拨入库同构）：\n- 「已收货」单：**默认按申报数量**计价入台账（实物已暂存、未开箱检验，账面为服务商申报的理论值）。\n- 「已质检·正品」单：**按实收数量**计价入台账（开箱逐件扫描后实测值，对应 WMS「待上架」），随后上架进入货区库存。\n- 「已质检·非正品」单：**按实收数量**计入「(整箱暂存)」桶（黑码非本公司销售商品，不做库存处理），但标记差异产生。\n- 「申报在途」单：服务商申报后未到仓，暂不计入台账。\n- 差异机制在「已收货 → 已质检」质检环节标记两类差异：① `数量差异 = 申报数量 − 实收数量`（数量不符）；② 商品不符。任一不配平/检出黑码即进入对账差异工单，根因归「申报不一致」（申报数量与实际收货不符）或「运输异常」（在途短少）。\n\n### 3.4合包国内子包裹入区\n合包子包裹以周转箱形式，由国内空运至迪拜，再由服务商清关完运输至仓库，收货人员通过PDA扫描周转箱进行收货处理，该状态可在包裹层面（包裹号关联周转箱号）上判断应收和实收的差异。提单号、周转箱号、包裹号关联。\n差异：申报资料（应收）与仓库实收 \n（1）关务申报资料数量变更但服务商按照旧版本进行申报 （2）清关或运输过程中周转箱丢失\n```mermaid\nflowchart LR\nsubgraph CARRIER[\"承运单元：周转箱（包裹号 ↔ 周转箱号映射）\"]\nC1[\"周转箱号 T001 关联 包裹号 P001/P002\u003cbr/\u003e国内空运 → 服务商清关 → 运抵仓库\"]\nC2[\"周转箱号 T002 关联 包裹号 P003\u003cbr/\u003e（在途/未到仓）\"]\nend\n\nsubgraph BOOK[\"台账口径（合包国内子包裹收货合计）\"]\nREADY[\"台账合计\u003cbr/\u003e统计状态：合包子包裹-已收货未打包\u003cbr/\u003eΣ「已收货未打包」 × 申报应收数量\"]\nend\n\nC1 -. 包裹号关联周转箱号 .-\u003e READY\n\nsubgraph DIFF[\"差异机制（包裹层面对账）\"]\nD1[\"差异标识点：PDA 扫描周转箱收货 → 逐箱扫描（包裹号关联周转箱号）\"]\nD2[\"数量差异 = 申报应收数量 − 实收数量\u003cbr/\u003e（申报资料 vs 仓库实收）\"]\nD2A[\"根因①：申报资料数量已变更，但服务商按【旧版本】申报 → 申报不一致\"]\nD2B[\"根因②：清关/运输过程中货物丢失 → 短少(运输异常)\"]\nD3[\"差 ≠ 0 → 差异记录 → 差异工单\u003cbr/\u003e（按根因①申报不一致 / 根因②运输异常分类）\"]\nD1 -.-\u003e D3\nD2 -.-\u003e D3\nD2A -.-\u003e D3\nD2B -.-\u003e D3\nend\n```\n**记账口径说明**（合包子包裹收货台账快照聚合公式）：\n- 「已收货扫描」包裹：按申报应收数量计入台账（PDA 扫周转箱收货、不拆箱逐包清点复核，账面为关务申报的理论值）。\n- **差异在箱/包裹层面**（包裹号关联周转箱号）比对：`数量差异 = 申报应收 − 实收`，差 ≠ 0 即进入对账差异工单，按两类根因分流：\n- **根因① 申报不一致**：TMS发送关务申报资料数量已变更，但服务商仍按旧版本申报，此为申报口径差异，通常需与关务/服务商核实版本后补正申报或调整台账基准。\n- **根因② 运输短少**：清关或运输过程中货物丢失导致实收 \u003c 申报应收，差异追责清关服务商并进入 KPI 考核。\n\n### 3.5取消返仓\n由于包裹取消导致的返仓处理，此处分为打包前取消和打包后取消\n差异：因为库存货物短缺导致的包裹取消，如：因合包子包裹商品缺失而取消，则产生差异，因本地商品缺失而取消，产生盘亏\n```mermaid\n\nflowchart TB\n\nSTART[\"包裹被取消\u003cbr/\u003e（拣货下架后 / 发货前）\"]\n TYPE{\"取消时点分型\"}\n\n%% ===== 打包前取消 =====\n\nTYPE -- \"打包前取消（未合包/打包）\" --\u003e PRE\nsubgraph PRE[\"打包前取消\"]\ndirection TB\nP1[\"合包业务·国内子包裹\u003cbr/\u003e取消 → 统计取消返仓『待处理』数量\"]\nP2[\"合包业务·迪拜本地商品\u003cbr/\u003e仍在库存明细表『待出库』状态\u003cbr/\u003e→ 不计算（原账不动，无迁移）\"]\nend\n\n%% ===== 打包后取消 =====\nTYPE -- \"打包后取消（已打包、发货前）\" --\u003e POST\nsubgraph POST[\"打包后取消\"]\ndirection TB\nQ1[\"合包包裹\u003cbr/\u003e（本地商品 + 国内子包裹已合包成包裹）\"]\nQ2[\"本地非合包业务包裹\"]\nQ3[\"统计该状态下的包裹商品\"]\nend\n\n%% ===== 统计入账 =====\n\nP1 --\u003e BOOKPRE[\"计入：取消返仓-待处理\u003cbr/\u003eΣ 打包前取消的国内子包裹商品数量\"]\nP2 -. 不计算 .-\u003e NOTHING[\"账面维持『待出库』，不迁出\"]\nQ3 --\u003e BOOKPOST[\"计入：取消返仓-待处理\u003cbr/\u003eΣ（合包包裹 + 本地非合包包裹）商品数量\"]\n\nsubgraph BOOK[\"台账口径（互斥桶：在库待处理-取消返仓，单独统计）\"]\nTOTAL[\"合计 = 打包前取消(国内子包裹)\u003cbr/\u003e+ 打包后取消(整包货物)\u003cbr/\u003e与『已打包待发货』『已收货未打包』互斥不重叠\"]\n\nend\n\nBOOKPRE --\u003e TOTAL\nBOOKPOST --\u003e TOTAL\n\n%% ===== 后续处理 =====\n\nTOTAL --\u003e RETURN[\"返仓处理完成（重新入库）\u003cbr/\u003e→ 返回货区可售库存\"]\n\n%% ===== 短缺取消 → 差异场景 =====\nsubgraph DIFF[\"差异机制\"]\nCANCEL1[\"打包前取消（因商品短缺而导致的包裹取消）\"]\nCANCEL2[\"打包后取消\"]\nD1[\"合包国内子包裹商品缺失（合包过程中发现）\"]\nCN[\"差异：国内仓库失误\u003cbr/\u003e→ 差异工单 · 追责国内仓\u003cbr/\u003e（根因：上游发运短少）\"]\nD2[\"本地仓库商品缺失（拣货时发现）\"]\nPL[\"差异：盘亏\u003cbr/\u003e→ 盘亏处理 · 账实调平\"]\nD3[\"差异：已申报出区而包裹实际取消而留库\"]\nend\n\nCANCEL1--\u003e  D1\nCANCEL1--\u003e  D2\nCANCEL2--\u003e D3\nD1--\u003e CN\nD2--\u003e PL\n```\n  \n\n**记账口径说明**：\n- 「打包前取消」合包国内子包裹直接统计，从「出库合包国内子包裹-已收货未打包」桶迁入「在库待处理-取消返仓」 ，子包裹已在库独立记账，取消即转为待处理\n- 「打包前取消 」 合包迪拜本地商品不计算，本地商品仍在库存明细表“待出库”状态，未产生合包动作，无需返仓重算\n- 「打包后取消」合包包裹的本地商品和国内子包裹已合包，统计整包货物，从「已打包待发货」桶迁入「取消返仓-待处理」\n- 「打包后取消」本地非合包业务包裹统计整包货物，从「已打包待发货」桶迁入「取消返仓-待处理」\n- **互斥不重叠**：任一包裹在任一时刻仅落一个统计状态桶；取消 = 原子迁移，即使实物仍在出库暂存区未移动。\n\n## 4.业务实体关系\ninventory_snapshot_record\n\n```mermaid\nerDiagram\n\n%% ========== 入库侧（调拨 / 客退） ==========\n\nALLOT_DF ||--o{ INVENTORY_DF : \"已质检 → 待上架（SKU 逻辑关联）\"\n\nRETURN_DF ||--o{ INVENTORY_DF : \"质检正品 → 待上架（次品/黑码不入货区）\"\n\n  \n\n%% ========== 合包链路 ==========\n\nCOMBINE_TRANSFER_BOX ||--o{ COMBINE_INVENTORY : \"转运箱收货→国内子包裹入合包\"\n\nCOMBINE_INVENTORY ||--o{ CANCEL_FANCANG_PKG : \"合包子包裹取消（打包前取消）\"\n\n  \n\n%% ========== 打包 → 包裹 ==========\n\nINVENTORY_DF ||--o{ PACK_DETAIL : \"待出库商品拣货打包（SKU 逻辑关联）\"\n\n  \n\n%% ========== 取消返仓 ==========\n\nPKG_INFO ||--o{ CANCEL_FANCANG_PKG : \"包裹取消（打包后取消）\"\n\n  \n\nALLOT_DF {\n\nstring allot_id PK\n\nstring allot_no \"调拨单号\"\n\nstring sku_name\n\nint expected_qty \"应收\"\n\nint actual_qty \"实收\"\n\nstring status \"已创建/已收货/已质检\"\n\ndatetime receive_time\n\n}\n\nRETURN_DF {\n\nstring return_id PK\n\nstring return_no \"退货单号\"\n\nstring sku_name\n\nint expected_qty \"申报应收\"\n\nint actual_qty \"实收\"\n\nstring status \"已创建/已收货/已质检\"\n\nstring qc_goods_type \"正品/次品/黑码\"\n\ndatetime receive_time\n\n}\n\nINVENTORY_DF {\n\nbigint inventory_id PK\n\nstring location \"库位\"\n\nstring sku_name\n\nstring status \"待上架/已入库/已预占/待出库\"\n\n}\n\nCOMBINE_TRANSFER_BOX {\n\nstring lading_serial_no \"提单号\"\n\nstring transfer_box_no \"周转箱号\"\n\nstring combine_pkg_no \"合包包裹号\"\n\nstring combine_cn_subpkg_no \"国内子包裹号\"\n\nint goods_qty\n\ndatetime receive_time\n\nstring status \"目的机场到达/已收货\"\n\n}\n\nCOMBINE_INVENTORY {\n\nstring combine_pkg_no \"合包包裹号\"\n\nstring sub_pkg_no \"国内/迪拜本地子包裹号\"\n\nstring sku_name\n\nint sku_qty\n\nstring status \"已收货/已打包/已发货\"\n\ndatetime receive_time\n\ndatetime pack_time\n\ndatetime ship_time\n\n}\n\nCANCEL_FANCANG_PKG {\n\nstring pkg_no \"合包=子包裹号/非合包=迪拜包裹号\"\n\nstring wellen_no \"波次号 SS=合包国内子包裹 DX=本地包裹\"\n\nstring sku_name\n\nint qty\n\nstring status \"待处理/已处理\"\n\ndatetime excption_time\n\n}\n\nPACK_DETAIL {\n\nstring pkg_no \"合包=迪拜本地子包裹号/非合包=包裹号\"\n\nstring sku_name\n\nint qty\n\ndatetime pack_time\n\n}\n\nPKG_INFO {\n\nstring pkg_no PK \"合包=合包包裹号/非合包=包裹号\"\n\nstring status \"已打包/已发货\"\n\nint qty\n\ndatetime pack_time\n\ndatetime ship_time\n\n}\n```\n数据表：\n调拨明细allot_df\n客退明细return_df\n库存明细表inventory_df\n合包转运箱管理combine_transfer_box\n合包明细管理combine_inventory\n取消返仓列表cancel_pkg\n打包明细pack_detail\n包裹管理pkg_info\n海关信息管理custom_detail:sku,hscode,describtion,declare_price,weight\n\n## 5.需求清单\n### P0\n1. 全状态库存台账：入库/客退/调拨/合包/库内/出库各统计状态可汇总，生成日度快照数据，数据准确性保障。\n2. 对账引擎：数量/货值差异计算与对账月度管理。\n3. 期初基盘导入：上线前完成一次全仓实物基盘，导入后系统期初总数与盘点数一致。\n4. 差异工单与根因分类闭环：客退/拒收入库、调拨入库应收/实收核对，合包子包裹数量核对、申报资料差异核对。\n### P1\n1. \"已清关未收货\"盲区状态可识别，二期TMS轨迹增加“清关完成”节点\n2. “整箱暂存”人工大客户出库商品的关务资料线上化\n\n[Figma原型](https://www.figma.com/make/Vcwsp3c8NA8cuSHQCni1sw/%E6%B5%B7%E5%85%B3%E5%BA%93%E5%AD%98%E7%AE%A1%E7%90%86%E7%B3%BB%E7%BB%9F%E5%8E%9F%E5%9E%8B?t=rR9RmwIBVwl62irK-1)  \n[Axure原型](http://127.0.0.1:32768/start.html?id=jehv2e\u0026p=%E5%85%A5%E5%8C%BA%E5%8F%B0%E8%B4%A6\u0026g=1)\n";
(async()=>{
  const content=document.getElementById('content');
  try {
    if(!window.marked) throw new Error('Markdown 渲染库加载失败，请检查网络连接后重新打开。');
    const currentMarkdown=markdown.replace('（场景 C）','').replace('> [!项目背景]','> **项目背景**').replace('### 1.1 项目目标（Goals）','## 1. 目标与范围\n### 1.1 项目目标（Goals）');
    content.innerHTML=marked.parse(currentMarkdown,{gfm:true,breaks:false});
    for(const quote of content.querySelectorAll('blockquote')){if(quote.textContent.trim().startsWith('项目背景'))quote.classList.add('project-background')}
    for(const paragraph of content.querySelectorAll('p')){if(paragraph.textContent.trim().startsWith('基于此，可归类为以下实物在库统计状态：'))paragraph.classList.add('inventory-state-list')}
    document.getElementById('loading').remove();
    const blocks=[...content.querySelectorAll('pre code.language-mermaid,pre code.lang-mermaid')];
    for(const code of blocks){const node=document.createElement('div');node.className='mermaid';node.textContent=code.textContent.replace(/\u00a0/g,' ');code.parentElement.replaceWith(node)}
    if(blocks.length){
      if(!window.mermaid) throw new Error('Mermaid 图表库加载失败，请检查网络连接后重新打开。');
      mermaid.initialize({startOnLoad:false,theme:'default',securityLevel:'strict'});
      await mermaid.run({nodes:[...content.querySelectorAll('.mermaid')]});
    }
  } catch(error) {

    document.getElementById('loading').className='render-error';
  }
})();
